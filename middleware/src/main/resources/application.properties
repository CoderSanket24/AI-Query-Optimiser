spring.application.name=middleware

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_optimizer
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true 

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ── Carbon Emission Tracking ──────────────────────────────────────────────────
# Server CPU thermal design power in watts (adjust to your actual hardware).
carbon.tdp-watts=150
# Regional grid carbon intensity in grams CO₂eq per kWh (India grid ≈ 708 g/kWh, CEA 2023).
carbon.intensity-g-per-kwh=708.0
# Estimated power per GB of SSD I/O reads in watts.
carbon.ssd-watt-per-gb=2.0